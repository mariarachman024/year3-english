<!DOCTYPE html>
<html lang="en-GB">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

                            DEFAULT: '#FFF59D',
                            dark: '#FFE082'
                        },

                            light: '#E0F7FA',
                            DEFAULT: '#B2EBF2',
                            dark: '#80DEEA'
                        },

                            DEFAULT: '#C8E6C9',

                    fontFamily: {
                        fredoka: ['Fredoka', 'cursive', 'sans-serif'],
                        quicksand: ['Quicksand', 'sans-serif']

    </script>

            user-select: none;

        h1, h2, h3, h4, .font-heading {
            font-family: 'Fredoka', cursive;
        }

        /* Cute Bouncy Hover Animations */

        /* Custom Scrollbar */

        }
        ::-webkit-scrollbar-track {
            background: #FFF0F5;
        }
        ::-webkit-scrollbar-thumb {
            background: #FF9EAA;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800 p-2 sm:p-4">

    <!-- TOP HEADER / NAV BAR -->
    <header class="max-w-5xl mx-auto w-full bg-white/90 backdrop-blur border-4 border-pastelPurple-dark rounded-3xl p-3 sm:p-4 shadow-lg mb-4 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center space-x-3">
            <div class="w-12 h-12 bg-pastelPink rounded-2xl flex items-center justify-center text-pink-600 font-bold text-2xl shadow-sm">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div>
                <span class="bg-purple-100 text-purple-700 font-bold text-xs px-2.5 py-0.5 rounded-full uppercase tracking-wide">Year 3 English</span>
                <h1 class="text-xl sm:text-2xl font-bold text-purple-900 leading-none mt-1">Comparative Adjectives</h1>
            </div>
        </div>

        <!-- Progress and Sound Controls -->
        <div class="flex items-center space-x-2 sm:space-x-4 w-full sm:w-auto justify-between sm:justify-end">
            <!-- Audio Toggle Button -->
            <button id="soundToggleBtn" onclick="toggleSound()" class="p-2.5 bg-pastelYellow-light hover:bg-pastelYellow border-2 border-yellow-400 rounded-2xl text-yellow-800 transition bounce-hover flex items-center gap-1.5 font-bold text-sm" title="Toggle Sound Effects">
                <i id="soundIcon" class="fa-solid fa-volume-high text-lg"></i>
                <span class="hidden sm:inline">Sound</span>
            </button>

            <!-- TTS Read Page Button -->
            <button onclick="readPageText()" class="p-2.5 bg-pastelBlue-light hover:bg-pastelBlue border-2 border-sky-400 rounded-2xl text-sky-800 transition bounce-hover flex items-center gap-1.5 font-bold text-sm" title="Listen to Page Text">
                <i class="fa-solid fa-bullhorn text-lg"></i>
                <span class="hidden sm:inline">Listen</span>
            </button>

            <!-- Page Counter Display -->
            <div class="bg-pastelPurple-light border-2 border-purple-300 rounded-2xl px-4 py-1.5 text-center">
                <span class="text-xs font-bold text-purple-600 block leading-tight">LESSON PAGE</span>
                <span id="pageIndicator" class="text-lg font-bold text-purple-900 font-heading leading-tight">1 / 12</span>
            </div>
        </div>
    </header>

    <!-- PROGRESS BAR -->
    <div class="max-w-5xl mx-auto w-full mb-4 px-2">
        <div class="w-full bg-white border-2 border-slate-200 h-4 rounded-full overflow-hidden p-0.5 shadow-inner">
            <div id="progressBar" class="bg-gradient-to-r from-pink-400 via-purple-400 to-sky-400 h-full rounded-full transition-all duration-500" style="width: 8.33%;"></div>
        </div>
    </div>

    <!-- MAIN LESSON CONTAINER -->
    <main class="max-w-5xl mx-auto w-full flex-grow flex flex-col justify-center">
        <!-- Card Frame -->
        <div class="bg-white border-4 border-pastelPink-dark rounded-3xl p-4 sm:p-8 shadow-xl min-h-[480px] flex flex-col justify-between relative overflow-hidden">
            
            <!-- Dynamic Content Area -->
            <div id="lessonContent" class="w-full flex-grow flex flex-col justify-center">
                <!-- Page contents injected dynamically via JavaScript -->
            </div>

        </div>
    </main>

    <!-- FOOTER NAVIGATION CONTROLS -->
    <footer class="max-w-5xl mx-auto w-full mt-4 flex items-center justify-between gap-2 px-2">
        <button id="btnHome" onclick="goToPage(1)" class="px-4 py-3 bg-white hover:bg-slate-50 border-3 border-slate-300 rounded-2xl font-bold text-slate-700 shadow bounce-hover bounce-click flex items-center gap-2 text-base sm:text-lg">
            <i class="fa-solid fa-house text-pink-500"></i>
            <span>HOME</span>
        </button>

        <div class="flex items-center space-x-3">
            <button id="btnBack" onclick="changePage(-1)" class="px-5 py-3 bg-pastelPurple hover:bg-purple-200 border-3 border-purple-400 text-purple-900 rounded-2xl font-bold shadow bounce-hover bounce-click flex items-center gap-2 text-base sm:text-lg">
                <i class="fa-solid fa-arrow-left"></i>
                <span>BACK</span>
            </button>

            <button id="btnNext" onclick="changePage(1)" class="px-6 py-3 bg-pastelPink-dark hover:bg-pink-400 text-white rounded-2xl font-bold shadow-lg bounce-hover bounce-click flex items-center gap-2 text-base sm:text-lg font-heading">
                <span>NEXT</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </footer>

    <script>
        // GLOBAL STATE
        let currentPage = 1;
        const totalPages = 12;
        let soundEnabled = true;

        // Interactive Page States
        let fillBlanksAnswers = {};
        let challengeAnswers = {};
        let mcqAnswers = {};
        let quizAnswers = {};
        let page7Answers = {};
        let page7Feedback = {};

        // Audio Effects Synthesizer (Web Audio API)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2); // G5
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'incorrect') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now); // A3
                    osc.frequency.setValueAtTime(180, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                }
            } catch (e) {
                console.log("Audio not supported or blocked");
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            const btn = document.getElementById('soundToggleBtn');
            if (soundEnabled) {
                icon.className = "fa-solid fa-volume-high text-lg";
                btn.classList.remove('opacity-50');
                playSound('click');
            } else {
                icon.className = "fa-solid fa-volume-xmark text-lg";
                btn.classList.add('opacity-50');
            }
        }

        // Text-to-Speech Helper
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop current speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-GB';
                utterance.rate = 0.85; // Slightly slower for primary pupils
                window.speechSynthesis.speak(utterance);
            }
        }

        // READ CURRENT PAGE CONTENT ACCESSIBILITY
        function readPageText() {
            playSound('click');
            const contentContainer = document.getElementById('lessonContent');
            if (!contentContainer) return;

            // Extract plain text from heading and paragraph blocks
            const texts = Array.from(contentContainer.querySelectorAll('h1, h2, h3, p, li, button, .read-me'))
                .map(el => el.innerText)
                .filter(t => t && t.trim().length > 0)
                .join('. ');

            speakText(texts);
        }

        // RENDER PAGE ROUTER
        function renderPage() {
            const container = document.getElementById('lessonContent');
            const indicator = document.getElementById('pageIndicator');
            const progressBar = document.getElementById('progressBar');

            indicator.innerText = `${currentPage} / ${totalPages}`;
            progressBar.style.width = `${(currentPage / totalPages) * 100}%`;

            // Update Back / Next state
            document.getElementById('btnBack').disabled = (currentPage === 1);
            document.getElementById('btnBack').style.opacity = (currentPage === 1) ? '0.5' : '1';

            let html = '';

            switch (currentPage) {
                case 1:
                    html = renderPage1();
                    break;
                case 2:
                    html = renderPage2();
                    break;
                case 3:
                    html = renderPage3();
                    break;
                case 4:
                    html = renderPage4();
                    break;
                case 5:
                    html = renderPage5();
                    break;
                case 6:
                    html = renderPage6();
                    break;
                case 7:
                    html = renderPage7();
                    break;
                case 8:
                    html = renderPage8();
                    break;
                case 9:
                    html = renderPage9();
                    break;
                case 10:
                    html = renderPage10();
                    break;
                case 11:
                    html = renderPage11();
                    break;
                case 12:
                    html = renderPage12();
                    break;
            }

            container.innerHTML = html;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changePage(delta) {
            playSound('click');
            currentPage += delta;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            renderPage();
        }

        function goToPage(page) {
            playSound('click');
            currentPage = page;
            renderPage();
        }

        // --- PAGE GENERATOR FUNCTIONS ---

        // PAGE 1: WELCOME
        function renderPage1() {
            return `
                <div class="text-center py-4 flex flex-col items-center justify-center">
                    <div class="inline-flex items-center gap-2 bg-yellow-100 text-yellow-800 border-2 border-yellow-300 font-bold px-4 py-1.5 rounded-full mb-3 shadow-sm animate-bounce">
                        <i class="fa-solid fa-star text-amber-500"></i>
                        <span>English Language • Year 3</span>
                    </div>

                    <h1 class="text-3xl sm:text-5xl font-black text-purple-900 mb-2 tracking-wide font-heading">
                        COMPARATIVE ADJECTIVES
                    </h1>
                    <p class="text-xl sm:text-2xl font-bold text-pink-600 mb-6 font-heading">
                        ✨ Let's Compare! ✨
                    </p>

                    <!-- Illustration Frame -->
                    <div class="bg-pastelBlue-light border-4 border-sky-300 rounded-3xl p-6 mb-6 max-w-xl w-full flex items-center justify-around shadow-inner relative overflow-hidden">
                        <!-- Animal 1: Elephant -->
                        <div class="text-center bounce-hover cursor-pointer" onclick="speakText('Big Elephant')">
                            <div class="text-6xl sm:text-7xl mb-2 animate-float">🐘</div>
                            <span class="bg-white px-3 py-1 rounded-full font-bold text-slate-700 shadow-sm border border-slate-200 text-sm">BIG</span>
                        </div>

                        <div class="text-pink-500 font-extrabold text-2xl font-heading">
                            VS
                        </div>

                        <!-- Animal 2: Cat -->
                        <div class="text-center bounce-hover cursor-pointer" onclick="speakText('Small Cat')">
                            <div class="text-4xl sm:text-5xl mb-2">🐱</div>
                            <span class="bg-white px-3 py-1 rounded-full font-bold text-slate-700 shadow-sm border border-slate-200 text-sm">SMALL</span>
                        </div>
                    </div>

                    <!-- Teacher Information Badge -->
                    <div class="bg-pastelPurple-light border-2 border-purple-300 rounded-2xl p-4 max-w-md w-full mb-6 text-slate-700 text-sm sm:text-base flex items-center justify-center gap-3">
                        <div class="w-10 h-10 bg-purple-400 text-white rounded-full flex items-center justify-center font-bold text-lg">
                            <i class="fa-solid fa-chalkboard-user"></i>
                        </div>
                        <div class="text-left">
                            <p class="font-bold text-purple-900 leading-tight">Teacher: Maria A. Rachman</p>
                            <p class="text-purple-700 font-medium">School: SK Puteri</p>
                        </div>
                    </div>

                    <button onclick="goToPage(2)" class="px-8 py-4 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-extrabold text-xl rounded-2xl shadow-xl bounce-hover bounce-click flex items-center gap-3 font-heading border-2 border-white">
                        <span>START LESSON</span>
                        <i class="fa-solid fa-circle-play text-2xl"></i>
                    </button>
                </div>
            `;
        }

        // PAGE 2: WHAT ARE COMPARATIVE ADJECTIVES?
        function renderPage2() {
            return `
                <div class="space-y-6">
                    <div class="border-b-4 border-pastelPink pb-3 flex items-center gap-3">
                        <div class="w-10 h-10 bg-pink-400 text-white rounded-2xl flex items-center justify-center font-bold text-xl">
                            1
                        </div>
                        <h2 class="text-2xl sm:text-3xl font-bold text-purple-900 font-heading">
                            What Are Comparative Adjectives?
                        </h2>
                    </div>

                    <div class="bg-pastelPurple-light border-3 border-purple-300 p-5 rounded-2xl text-slate-800 text-lg sm:text-xl font-medium leading-relaxed shadow-sm">
                        <i class="fa-solid fa-lightbulb text-yellow-500 text-2xl mr-2"></i>
                        Comparative adjectives are special words used to compare <span class="bg-yellow-200 px-2 py-0.5 rounded-lg font-bold text-purple-900 border border-yellow-400">TWO</span> people, animals, or things!
                    </div>

                    <!-- Visual Example Card -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- Example 1 -->
                        <div class="bg-pink-50 border-3 border-pink-300 rounded-2xl p-5 text-center bounce-hover shadow-sm flex flex-col items-center justify-between">
                            <div class="flex items-center justify-center gap-4 my-2">
                                <span class="text-6xl">🐘</span>
                                <i class="fa-solid fa-greater-than text-pink-400 text-xl font-black"></i>
                                <span class="text-4xl">🐱</span>
                            </div>
                            <p class="text-lg sm:text-xl font-bold text-slate-800 mt-2">
                                The elephant is <span class="bg-pink-200 text-pink-900 px-2 py-1 rounded-lg border border-pink-400 font-extrabold">bigger than</span> the cat.
                            </p>
                            <button onclick="speakText('The elephant is bigger than the cat')" class="mt-3 text-xs bg-pink-200 hover:bg-pink-300 text-pink-800 font-bold px-3 py-1 rounded-full transition">
                                <i class="fa-solid fa-volume-high mr-1"></i> Listen
                            </button>
                        </div>

                        <!-- Example 2 -->
                        <div class="bg-sky-50 border-3 border-sky-300 rounded-2xl p-5 text-center bounce-hover shadow-sm flex flex-col items-center justify-between">
                            <div class="flex items-center justify-center gap-4 my-2">
                                <span class="text-4xl">🐱</span>
                                <i class="fa-solid fa-less-than text-sky-400 text-xl font-black"></i>
                                <span class="text-6xl">🐘</span>
                            </div>
                            <p class="text-lg sm:text-xl font-bold text-slate-800 mt-2">
                                The cat is <span class="bg-sky-200 text-sky-900 px-2 py-1 rounded-lg border border-sky-400 font-extrabold">smaller than</span> the elephant.
                            </p>
                            <button onclick="speakText('The cat is smaller than the elephant')" class="mt-3 text-xs bg-sky-200 hover:bg-sky-300 text-sky-800 font-bold px-3 py-1 rounded-full transition">
                                <i class="fa-solid fa-volume-high mr-1"></i> Listen
                            </button>
                        </div>
                    </div>

                    <div class="bg-yellow-50 border-2 border-yellow-300 rounded-2xl p-4 text-center">
                        <p class="text-base font-bold text-yellow-900">
                            🌟 Key Rule: Notice how we add <span class="underline decoration-pink-500 font-black text-pink-600">-er</span> and use <span class="underline decoration-purple-500 font-black text-purple-700">than</span>!
                        </p>
                    </div>
                </div>
            `;
        }

        // PAGE 3: RULE 1 - SHORT ADJECTIVES
        function renderPage3() {
            const shortAdjectives = [
                { word: 'tall', comp: 'taller', icon: '🦒' },
                { word: 'small', comp: 'smaller', icon: '🐭' },
                { word: 'fast', comp: 'faster', icon: 'Cheetah 🐆' },
                { word: 'slow', comp: 'slower', icon: '🐢' },
                { word: 'old', comp: 'older', icon: '👴' },
                { word: 'young', comp: 'younger', icon: '👶' },
                { word: 'short', comp: 'shorter', icon: '🧍' },
                { word: 'long', comp: 'longer', icon: '📏' }
            ];

            return `
                <div class="space-y-5">
                    <div class="border-b-4 border-pastelPurple pb-2 flex items-center gap-3">
                        <div class="w-10 h-10 bg-purple-500 text-white rounded-2xl flex items-center justify-center font-bold text-xl">
                            2
                        </div>
                        <div>
                            <h2 class="text-2xl sm:text-3xl font-bold text-purple-900 font-heading">
                                Rule 1: Short Adjectives
                            </h2>
                            <p class="text-sm font-semibold text-purple-600">For many short adjectives, simply add <span class="bg-purple-200 text-purple-900 px-2 py-0.5 rounded font-bold">-er</span>!</p>
                        </div>
                    </div>

                    <!-- Adjective Flashcard Grid -->
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        ${shortAdjectives.map(item => `
                            <div onclick="speakText('${item.word}, ${item.comp}')" class="bg-purple-50 hover:bg-purple-100 border-2 border-purple-200 rounded-2xl p-3 text-center cursor-pointer bounce-hover shadow-sm">
                                <div class="text-2xl mb-1">${item.icon.includes(' ') ? item.icon.split(' ')[1] : item.icon}</div>
                                <div class="text-slate-500 font-medium text-xs uppercase tracking-wider">${item.word}</div>
                                <div class="text-purple-900 font-extrabold text-lg font-heading">${item.comp}</div>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Sentence Examples -->
                    <div class="bg-pastelYellow-light border-3 border-yellow-300 rounded-2xl p-4 space-y-3">
                        <h3 class="font-bold text-yellow-900 text-base flex items-center gap-2 font-heading">
                            <i class="fa-solid fa-comment-dots text-amber-500"></i> Sentence Examples:
                        </h3>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm sm:text-base">
                            <div class="bg-white p-3 rounded-xl border border-yellow-200 font-bold text-slate-800 flex items-center justify-between">
                                <span>👦 Ali is <span class="text-pink-600">taller than</span> Ben. 👦</span>
                                <button onclick="speakText('Ali is taller than Ben')" class="text-purple-600 hover:text-purple-800"><i class="fa-solid fa-volume-high"></i></button>
                            </div>
                            <div class="bg-white p-3 rounded-xl border border-yellow-200 font-bold text-slate-800 flex items-center justify-between">
                                <span>🐇 A rabbit is <span class="text-pink-600">faster than</span> a turtle. 🐢</span>
                                <button onclick="speakText('A rabbit is faster than a turtle')" class="text-purple-600 hover:text-purple-800"><i class="fa-solid fa-volume-high"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // PAGE 4: SPELLING RULES
        function renderPage4() {
            return `
                <div class="space-y-5">
                    <div class="border-b-4 border-pastelYellow pb-2 flex items-center gap-3">
                        <div class="w-10 h-10 bg-amber-400 text-white rounded-2xl flex items-center justify-center font-bold text-xl">
                            3
                        </div>
                        <h2 class="text-2xl sm:text-3xl font-bold text-amber-900 font-heading">
                            Spelling Rules for Short Words
                        </h2>
                    </div>

                    <!-- 4 Colourful Cards -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- Rule 1 -->
                        <div class="bg-pink-50 border-3 border-pink-300 rounded-2xl p-4 shadow-sm">
                            <span class="bg-pink-200 text-pink-800 text-xs font-bold px-2.5 py-1 rounded-full uppercase">Rule 1</span>

            { q: "1. An elephant is _______ than a cat.", options: ["bigger", "more big", "big"], ans: 0 },
            { q: "2. Ali is _______ than Ben.", options: ["tall", "taller", "more tall"], ans: 1 },
            { q: "3. A rabbit is _______ than a turtle.", options: ["fast", "more fast", "faster"], ans: 2 },
            { q: "4. A turtle is _______ than a rabbit.", options: ["slower", "slow", "more slow"], ans: 0 },
            { q: "5. The red dress is _______ than the blue dress.", options: ["beautifuler", "more beautiful", "beautiful"], ans: 1 },
            { q: "6. Don't forget to use _______ after comparative adjectives!", options: ["then", "than", "that"], ans: 1 },
            { q: "7. The word 'happy' becomes _______ in comparative form.", options: ["happyer", "more happy", "happier"], ans: 2 },
            { q: "8. A car is _______ than a bicycle.", options: ["faster", "fast", "more fast"], ans: 0 },
            { q: "9. A lion is _______ than a cat.", options: ["strong", "stronger", "more strong"], ans: 1 },
            { q: "10. My pencil is _______ than your pencil.", options: ["more long", "longer", "long"], ans: 1 }
        ];

        let quizSubmitted = false;

        function renderPage12() {
            if (!quizSubmitted) {
                return `
                    <div class="space-y-5">
                        <div class="border-b-4 border-pastelPink pb-2 flex items-center justify-between">
                            <h2 class="text-2xl sm:text-3xl font-bold text-pink-900 font-heading">
                                🌟 FINAL QUIZ (10 Questions)
                            </h2>
                            <span class="bg-pink-100 text-pink-800 font-bold text-xs px-3 py-1 rounded-full">Test Your Knowledge</span>
                        </div>

                        <div class="space-y-4 max-h-[340px] overflow-y-auto pr-2">
                            ${finalQuizQuestions.map((q, qIdx) => `
                                <div class="bg-purple-50 border-2 border-purple-200 rounded-2xl p-3.5 shadow-sm">
                                    <p class="font-bold text-slate-800 text-sm sm:text-base mb-2">${q.q}</p>
                                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                        ${q.options.map((opt, optIdx) => `
                                            <button onclick="quizAnswers[${qIdx}] = ${optIdx}; renderPage();" class="p-2 rounded-xl text-xs sm:text-sm font-bold transition text-left ${quizAnswers[qIdx] === optIdx ? 'bg-purple-600 text-white border-2 border-purple-700' : 'bg-white border border-slate-300 text-slate-700 hover:bg-purple-100'}">
                                                ${String.fromCharCode(65 + optIdx)}. ${opt}
                                            </button>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <button onclick="submitQuiz()" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold text-lg rounded-2xl shadow-lg bounce-hover bounce-click font-heading border-2 border-emerald-300">
                            SUBMIT FINAL QUIZ 🎉
                        </button>
                    </div>
                `;
            } else {
                // Calculate Score
                let score = 0;
                finalQuizQuestions.forEach((q, idx) => {
                    if (quizAnswers[idx] === q.ans) score++;
                });

                const percentage = Math.round((score / finalQuizQuestions.length) * 100);
                let badge = "";
                let message = "";
                let colorClass = "";

                if (percentage >= 90) {
                    badge = "🏆 Amazing!";
                    message = "You are a Comparative Adjective Champion!";
                    colorClass = "text-yellow-600 bg-yellow-100 border-yellow-400";
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                } else if (percentage >= 70) {
                    badge = "🌟 Great job!";
                    message = "Keep practising! You are doing really well!";
                    colorClass = "text-purple-600 bg-purple-100 border-purple-400";
                } else {
                    badge = "💪 Good try!";
                    message = "Let's practise again to become a champion!";
                    colorClass = "text-sky-600 bg-sky-100 border-sky-400";
                }

                return `
                    <div class="text-center py-4 space-y-5 flex flex-col items-center justify-center">
                        <div class="inline-block border-4 rounded-3xl p-6 ${colorClass} max-w-md w-full shadow-lg">
                            <span class="text-5xl block mb-2">${badge.split(' ')[0]}</span>
                            <h2 class="text-3xl font-black font-heading mb-1">${badge}</h2>
                            <p class="font-bold text-lg mb-3">${message}</p>
                            
                            <div class="bg-white rounded-2xl p-4 border border-slate-200">
                                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">YOUR SCORE</span>
                                <span class="text-4xl font-black text-purple-900 font-heading">${percentage}%</span>
                                <p class="text-xs font-bold text-slate-600 mt-1">(${score} out of 10 correct)</p>
                            </div>
                        </div>

                        <div class="flex items-center gap-3">
                            <button onclick="quizSubmitted = false; quizAnswers = {}; renderPage();" class="px-6 py-3 bg-pastelYellow border-2 border-yellow-400 text-yellow-900 rounded-2xl font-bold shadow bounce-hover bounce-click font-heading">
                                TRY AGAIN 🔄
                            </button>
                            <button onclick="goToPage(1)" class="px-6 py-3 bg-pastelPink-dark border-2 border-pink-400 text-white rounded-2xl font-bold shadow bounce-hover bounce-click font-heading">
                                FINISH LESSON 🎉
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        function submitQuiz() {
            if (Object.keys(quizAnswers).length < finalQuizQuestions.length) {
                playSound('incorrect');
                alert("Please answer all 10 questions before submitting!");
                return;
            }
            playSound('correct');
            quizSubmitted = true;
            renderPage();
        }

        // INITIALIZE ON LOAD
        window.onload = function() {
            renderPage();
        };
    </script>
</body>
</html>
